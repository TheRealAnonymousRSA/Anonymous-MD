<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anonymous-MD • Pair</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#fff}
.card{width:min(92vw,520px);padding:32px;border:1px solid #292933;border-radius:20px;background:#15151c;box-shadow:0 20px 70px #0008}
h1{margin:0 0 8px}.muted{color:#aaa}.code{font:700 30px ui-monospace,monospace;letter-spacing:4px;padding:18px;text-align:center;border-radius:14px;background:#0b0b0f;margin:20px 0}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#22222b;color:#ddd}
</style>
</head>
<body>
<main class="card">
  <span class="badge">Anonymous-MD</span>
  <h1>WhatsApp Pairing</h1>
  <p class="muted">Developer: <strong id="dev">TheRealAnonymousRSA</strong></p>
  <p>Pair your WhatsApp account using the code generated by the bot.</p>
  <div class="code" id="code">WAITING</div>
  <p class="muted" id="owner">No account paired yet.</p>
</main>
<script>
async function refresh(){
  try{
    const r=await fetch('/api/pairing-code');
    const d=await r.json();
    document.getElementById('dev').textContent=d.developer;
    document.getElementById('code').textContent=d.code || 'WAITING';
    const s=await (await fetch('/api/status')).json();
    document.getElementById('owner').textContent=s.owner ? 'Paired account: '+s.owner : 'No account paired yet.';
  }catch(e){}
}
refresh(); setInterval(refresh,3000);
</script>
</body>
</html>
